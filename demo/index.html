<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TakeNotes — prototype</title>
<meta name="description" content="Clickable iPad prototype of TakeNotes, a study notebook that quizzes you on what you wrote.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;700&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=DM+Serif+Display&display=swap" rel="stylesheet">
<style>
:root{
  --canvas:#F6F4EF; --surface:#FFFFFF; --muted:#EEEBE4; --ink:#171614; --text:#171614; --text2:#6F6B64; --on-dark:#FFFFFF;
  --blue:#BFD0F7; --orange:#F7BE98; --green:#B3DBBB; --purple:#D7C3F2; --yellow:#F0DF96; --grid:#E2E7EF;
  --wrong:#F3C9C2; --right:#C6E5CC;
  --serif:'DM Serif Display', Georgia, serif; --sans:'DM Sans', system-ui, sans-serif; --hand:'Caveat', cursive;
  --stage:#2B2A27;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--stage);font-family:var(--sans);color:var(--text);-webkit-font-smoothing:antialiased;overflow:hidden}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
input{font:inherit;color:inherit}

/* stage chrome */
.chrome{position:fixed;top:0;left:0;right:0;height:56px;display:flex;align-items:center;gap:12px;padding:0 16px;color:#EDEAE3;z-index:50}
.chrome .brand{font-family:var(--serif);font-size:20px}
.chrome .tag{font-size:12px;opacity:.6}
.chrome .sp{flex:1}
.chrome button{background:rgba(255,255,255,.1);padding:8px 14px;border-radius:999px;font-size:13px;font-weight:600;color:#EDEAE3}
.chrome button:hover{background:rgba(255,255,255,.18)}
.menu{position:fixed;top:56px;right:16px;width:300px;max-height:calc(100vh - 72px);overflow:auto;background:#fff;border-radius:18px;padding:10px;z-index:60;display:none;box-shadow:0 20px 60px rgba(0,0,0,.35)}
.menu.open{display:block}
.menu h4{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--text2);padding:10px 10px 4px}
.menu button{display:block;width:100%;text-align:left;padding:8px 10px;border-radius:10px;font-size:14px}
.menu button:hover{background:var(--canvas)}
.stage{position:fixed;inset:56px 0 0 0;display:flex;align-items:center;justify-content:center}
.device{width:1194px;height:834px;flex:none;border-radius:32px;overflow:hidden;position:relative;background:var(--canvas);transform-origin:center center;box-shadow:0 30px 80px rgba(0,0,0,.4)}

/* layout helpers */
.screen{position:absolute;inset:0;display:flex;flex-direction:column;background:var(--canvas)}
.status{display:flex;justify-content:space-between;padding:12px 28px 4px;font-size:13px;font-weight:600;flex:none;align-self:stretch}
.fullw{align-self:stretch}
.noanim *{animation:none!important}
.row{display:flex;align-items:center}
.col{display:flex;flex-direction:column}
.grow{flex:1;min-width:0}
.gap4{gap:4px}.gap6{gap:6px}.gap8{gap:8px}.gap10{gap:10px}.gap12{gap:12px}.gap14{gap:14px}.gap16{gap:16px}.gap20{gap:20px}.gap24{gap:24px}
.serif{font-family:var(--serif);font-weight:400;letter-spacing:-.005em;line-height:1.12}
.t34{font-size:34px}.t36{font-size:36px}.t30{font-size:30px}.t28{font-size:28px}.t44{font-size:44px}.t72{font-size:72px}
.sec{color:var(--text2)}
.s12{font-size:12px}.s13{font-size:13px}.s14{font-size:14px}.s15{font-size:15px}.s16{font-size:16px}.s17{font-size:17px}.s18{font-size:18px}.s20{font-size:20px}
.b5{font-weight:500}.b6{font-weight:600}.b7{font-weight:700}
.hand{font-family:var(--hand)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:14px 22px;border-radius:14px;font-weight:600;font-size:16px;white-space:nowrap;transition:transform .12s ease, opacity .12s}
.btn:active{transform:scale(.97)}
.btn.sm{padding:10px 16px;font-size:14px}
.btn.ink{background:var(--ink);color:var(--on-dark)}
.btn.muted{background:var(--muted)}
.btn.surface{background:var(--surface)}
.btn[disabled]{opacity:.4;pointer-events:none}
.card{background:var(--surface);border-radius:24px}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:5px 12px;font-size:13px;font-weight:600}
.seg{display:inline-flex;background:var(--muted);border-radius:999px;padding:3px;gap:2px}
.seg button{padding:7px 14px;border-radius:999px;font-size:14px;font-weight:500;color:var(--text2)}
.seg button.on{background:var(--surface);color:var(--text);font-weight:600}
.icon{width:22px;height:22px;flex:none}
.dot{width:12px;height:12px;border-radius:50%;flex:none}
.c-blue{background:var(--blue)}.c-orange{background:var(--orange)}.c-green{background:var(--green)}.c-purple{background:var(--purple)}.c-yellow{background:var(--yellow)}
.option{display:flex;align-items:center;gap:14px;padding:18px 22px;border-radius:18px;background:var(--surface);text-align:left;width:100%;font-size:18px;font-weight:600;transition:background .15s}
.option.on{background:var(--ink);color:var(--on-dark)}
.option .sub{font-size:14px;font-weight:400;color:var(--text2)}
.option.on .sub{color:#d8d5cf}
.check{width:26px;height:26px;border-radius:50%;background:var(--muted);display:flex;align-items:center;justify-content:center;flex:none}
.option.on .check{background:var(--surface)}
.progress{flex:1;height:8px;border-radius:4px;background:var(--muted);overflow:hidden}
.progress i{display:block;height:100%;background:var(--ink);border-radius:4px;transition:width .3s}
.scroll{overflow:auto}
.scroll::-webkit-scrollbar{width:0;height:0}

/* overlays */
.dim{position:absolute;inset:0;background:rgba(23,22,20,.32);display:flex;align-items:center;justify-content:center;z-index:30;animation:fade .18s ease}
.sheet{background:var(--surface);border-radius:32px;padding:28px 32px;width:560px;max-height:780px;overflow:auto;animation:rise .22s ease}
.bottom-sheet{position:absolute;left:0;right:0;bottom:0;background:var(--surface);border-radius:32px 32px 0 0;padding:28px 237px 32px;z-index:21;animation:up .22s ease}
@keyframes fade{from{opacity:0}}@keyframes rise{from{opacity:0;transform:translateY(12px)}}@keyframes up{from{transform:translateY(40px);opacity:0}}
.field{background:var(--canvas);border-radius:14px;padding:14px 16px;font-size:17px;font-weight:500;border:0;outline:none;width:100%}
.label{font-size:14px;font-weight:600;color:var(--text2)}

/* paper */
.paper{position:relative;background-color:var(--surface);border-radius:20px;overflow:hidden}
.paper.grid{background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:28px 28px;background-position:-4px -4px}
.paper.lines{background-image:linear-gradient(var(--grid) 1px,transparent 1px);background-size:100% 36px;background-position:0 30px}
.paper.dots{background-image:radial-gradient(#C9CFD9 1.2px,transparent 1.4px);background-size:28px 28px}
.paper.blank{background-image:none}
.ink-line{position:absolute;font-family:var(--hand);font-size:30px;line-height:1.2;white-space:nowrap}
.hl{background:rgba(240,223,150,.75);border-radius:6px;padding:0 6px}
.q{position:absolute;right:20px;width:26px;height:26px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;transition:all .15s}
.q.mine{background:var(--ink);color:#fff}
.q.sug{background:var(--muted);color:var(--text2)}
.q.off{background:transparent;color:transparent;outline:1.5px dashed #d7d2c8}
.cover{position:absolute;background:var(--yellow);border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:600;color:var(--text2);cursor:pointer}
.tool{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center}
.tool.on{background:var(--ink)}
.tool.on svg path{stroke:#fff}
.toast{position:absolute;left:50%;bottom:28px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 18px;border-radius:14px;font-size:14px;font-weight:600;z-index:40;animation:rise .2s ease}
.side-item{padding:11px 14px;border-radius:12px;font-size:16px;font-weight:500;color:var(--text2);text-align:left;width:100%}
.side-item.on{background:var(--surface);color:var(--text);font-weight:600}
.cover-nb{border-radius:18px;height:250px;position:relative;overflow:hidden;display:flex;align-items:flex-end;padding:0 10px 18px 22px;font-size:16px;font-weight:600;text-align:left;width:100%}
.cover-nb::before{content:"";position:absolute;left:0;top:0;bottom:0;width:12px;background:rgba(0,0,0,.06)}
.thumb{background-color:var(--surface);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:16px 16px;border-radius:14px;padding:10px 14px;font-family:var(--hand);overflow:hidden;text-align:left}
.toggle{width:52px;height:32px;border-radius:999px;background:var(--muted);padding:3px;display:flex;transition:background .15s}
.toggle i{width:26px;height:26px;border-radius:50%;background:#fff;transition:transform .15s}
.toggle.on{background:var(--ink)}.toggle.on i{transform:translateX(20px)}
.date-tile{width:52px;height:52px;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;flex:none}
.date-tile b{font-size:18px}.date-tile small{font-size:11px;font-weight:600}
.pad{background:var(--surface);border-radius:18px;height:120px;position:relative;display:flex;align-items:center;padding:0 28px}
.pad input{border:0;outline:none;background:transparent;font-family:var(--hand);font-size:48px;width:100%}
.pad::after{content:"";position:absolute;left:20px;right:20px;bottom:28px;height:1px;background:var(--muted)}
.gapbox{display:inline-block;width:120px;height:40px;background:var(--yellow);border-radius:10px;vertical-align:middle;margin-left:10px}
.strip{position:relative;padding:22px 28px;border-radius:18px;background-color:var(--surface);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:24px 24px;font-family:var(--hand);font-size:34px;line-height:1.4}
</style>
</head>
<body>
<div class="chrome">
  <span class="brand">TakeNotes</span><span class="tag">iPad prototype · design concept</span>
  <span class="sp"></span>
  <button id="restart">Restart</button>
  <button id="menuBtn">All screens</button>
</div>
<div class="menu" id="menu"></div>
<div class="stage"><div class="device" id="device"></div></div>

<script>
/* ---------- icons ---------- */
const I = (d, c='#171614', s=22) => `<svg class="icon" style="width:${s}px;height:${s}px" viewBox="0 0 24 24" fill="none"><path d="${d}" stroke="${c}" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
const ic = {
  back:'M15 18l-6-6 6-6', next:'M9 6l6 6-6 6', close:'M6 6l12 12M18 6L6 18', check:'M5 12l5 5 9-10', plus:'M12 6v12M6 12h12',
  pen:'M4 20l4-1L19 8l-3-3L5 16l-1 4z', hl:'M14 5l5 5-7 7H7v-5l7-7zM5 21h8', eraser:'M8 20h12M5 15l8-8 5 5-7 7H9l-4-4z',
  lasso:'M12 5c4.4 0 8 2.2 8 5s-3.6 5-8 5-8-2.2-8-5 3.6-5 8-5zM8 14.5c-1 1.5-.5 3.5 1.5 4.5', search:'M11 18a7 7 0 1 0 0-14 7 7 0 0 0 0 14zM20 20l-4-4',
  camera:'M4 7h3l2-2h6l2 2h3v12H4zM12 17a4 4 0 1 0 0-8 4 4 0 0 0 0 8z', photo:'M4 5h16v14H4zM4 15l5-5 5 5 3-3 3 3', pdf:'M7 3h7l5 5v13H7zM14 3v5h5',
  cut:'M6 4l12 12M14 4h4v4M4 14v6h6', text:'M5 5h14M5 12h14M5 19h9', play:'M8 5v14l11-7z', down:'M6 9l6 6 6-6'
};
const graph = (w=300,h=160) => `<svg width="${w}" height="${h}" viewBox="0 0 300 160" fill="none"><path d="M20 140H290M150 150V10" stroke="#9A968F" stroke-width="1.5"/><path d="M60 20C100 150 200 150 240 20" stroke="#171614" stroke-width="2.5"/><path d="M175 140L275 40" stroke="#5E80D6" stroke-width="2"/><circle cx="215" cy="100" r="5" fill="#5E80D6"/></svg>`;

/* ---------- state ---------- */
const initial = () => ({
  screen:'welcome', overlay:null, toast:null,
  name:'Alex', study:'Economics', year:'3rd',
  obstacles:{fast:true, ready:true, time:false, regular:false, hard:false},
  daily:5, guest:false,
  notebooks:[
    {id:'math',name:'Mathematics',color:'blue',meta:'Exam in 9 days',pages:38},
    {id:'eng',name:'English',color:'orange',meta:'24 pages',pages:24},
    {id:'phys',name:'Physics',color:'green',meta:'16 pages',pages:16},
    {id:'hist',name:'History',color:'purple',meta:'9 pages',pages:9}],
  classes:[[0,'Mathematics',10,11.5,'Room 204'],[0,'English',12,13.5,'Room 12'],[0,'Physics',14.5,16,'Lab 3'],[1,'Physics',9,10.5,'Lab 3'],[1,'Mathematics',14,15.5,'Room 204'],[2,'English',10,11.5,'Room 12'],[2,'History',13,14.5,'Hall B'],[3,'Mathematics',10,11.5,'Room 204'],[3,'Physics',13,14.5,'Lab 3'],[4,'History',9,10.5,'Hall B']],
  paper:'grid', panel:null, tool:'pen', recording:false, collected:false,
  collect:{d1:true,d2:true,d3:true,d4:false},
  qmarks:{l1:'sug',l2:'mine',l3:'mine',l4:'mine',l5:'sug'},
  tm:{revealed:{}, recalled:0, seenIntro:false, asking:null},
  quiz:null, plans:{yearly:true, pick:'basic'},
  settings:{weekend:false, lock:false, daily:5}, notif:null, newNb:{name:'Statistics',color:'yellow',paper:'Grid'},
  addClass:{day:2}, emptyHome:false
});
let S = initial();
const set = (patch) => { Object.assign(S, patch); render(); };
const go = (screen, extra={}) => { S.overlay=null; set({screen, ...extra}); };
const toast = (t) => { S.toast=t; render(); clearTimeout(window.__t); window.__t=setTimeout(()=>{S.toast=null;render();},1800); };
const colorOf = n => ({Mathematics:'blue',English:'orange',Physics:'green',History:'purple',Statistics:'yellow'})[n]||'yellow';

/* ---------- shared pieces ---------- */
const status = (dark) => `<div class="status" style="${dark?'color:#fff':''}"><span>9:41&nbsp;&nbsp;&nbsp;Mon 26 Oct</span><span>100%</span></div>`;
const obTop = (frac, back) => `<div class="row gap20 fullw" style="padding:14px 28px 0"><button data-go="${back}">${I(ic.back)}</button><div class="progress"><i style="width:${frac*100}%"></i></div><button class="s16 b5 sec" data-go="signin">Skip</button></div>`;
const backBar = (label, to) => `<div class="row gap8" style="padding:10px 24px 0"><button class="row gap6" data-go="${to}">${I(ic.back)}<span class="s16 b5">${label}</span></button></div>`;

/* ---------- screens ---------- */
const screens = {};

screens.welcome = () => `
<div class="screen" style="align-items:center">${status()}
  <div style="position:absolute;left:40px;top:40px" class="serif" style="font-size:24px"><span class="serif" style="font-size:24px">TakeNotes</span></div>
  <div class="serif t44" style="text-align:center;margin-top:56px;line-height:1.1">The notebook that knows<br>what you forget.</div>
  <div class="s18 sec" style="margin-top:16px">Take notes by hand. Get questions from them. Remember them at the exam.</div>
  <div style="position:relative;width:520px;height:330px;margin-top:20px">
    ${['purple','orange','green','blue'].map((c,i)=>`<div class="c-${c}" style="position:absolute;width:200px;height:270px;border-radius:18px;left:${i*95}px;top:${[30,10,20,40][i]}px;transform:rotate(${[-10,-3,5,12][i]}deg)"></div>`).join('')}
  </div>
  <button class="btn ink" style="width:420px;margin-top:18px" data-go="ob-name">Get started</button>
  <button class="s16 b6 sec" style="margin-top:16px" data-go="signin">I already have an account</button>
</div>`;

const obScreen = (frac, back, step, title, sub, body, next, nextLabel='Continue') => `
<div class="screen" style="align-items:center">${status()}${obTop(frac, back)}
  <div class="col gap12" style="width:600px;margin-top:48px">
    <div class="s14 b6 sec">${step}</div>
    <div class="serif t36">${title}</div>
    ${sub?`<div class="s17 sec" style="line-height:1.4">${sub}</div>`:''}
    <div style="height:14px"></div>${body}
  </div>
  <div class="grow"></div>
  <button class="btn ink" style="width:600px;margin-bottom:40px" data-go="${next}">${nextLabel}</button>
</div>`;

screens['ob-name'] = () => obScreen(.17,'welcome','Step 1 of 6','What should we call you?','We’ll use it in reminders and greetings.',
  `<input class="field" style="background:var(--surface);font-size:22px;padding:20px 22px" value="${S.name}" data-input="name">`, 'ob-study');

screens['ob-study'] = () => obScreen(.33,'ob-name','Step 2 of 6','What do you study?','We’ll suggest notebooks for your subjects.',
  `<input class="field" style="background:var(--surface);font-size:20px;padding:18px 22px" value="${S.study}" data-input="study">
   <div class="label" style="margin-top:6px">Year</div>
   <div class="row gap8">${['1st','2nd','3rd','4th','Master’s'].map(y=>`<button class="pill" style="padding:9px 16px;font-size:15px;background:${S.year===y?'var(--ink)':'var(--surface)'};color:${S.year===y?'#fff':'inherit'}" data-set-year="${y}">${y}</button>`).join('')}</div>
   <div class="label" style="margin-top:6px">Notebooks to start with</div>
   <div class="row gap8" style="flex-wrap:wrap">${[['Microeconomics','blue',1],['Statistics','yellow',1],['Mathematics','green',1],['English','orange',0],['Accounting','purple',0]].map(([n,c,on])=>`<span class="pill c-${on?c:''}" style="padding:9px 14px;font-size:15px;${on?'':'background:var(--surface)'}">${I(on?ic.check:ic.plus,on?'#171614':'#6F6B64',14)}${n}</span>`).join('')}</div>`, 'ob-obstacles');

screens['ob-obstacles'] = () => obScreen(.5,'ob-study','Step 3 of 6','What usually gets in the way?','Choose all that apply — we’ll tune your daily questions.',
  `<div class="col gap10">${[['fast','I forget what I learned fast'],['ready','I don’t feel ready for exams'],['time','Not enough time'],['regular','Hard to study regularly'],['hard','Some topics are too hard']].map(([k,t])=>`<button class="option ${S.obstacles[k]?'on':''}" data-toggle-ob="${k}"><span class="grow">${t}</span><span class="check">${S.obstacles[k]?I(ic.check,'#171614',16):''}</span></button>`).join('')}</div>`, 'ob-daily');

screens['ob-daily'] = () => obScreen(.67,'ob-obstacles','Step 4 of 6','How many questions a day?','They come from your own notes. You can change this any time.',
  `<div class="col gap10">${[[3,'About 2 minutes','Light'],[5,'About 3 minutes','Regular'],[10,'About 6 minutes','Serious'],[15,'About 9 minutes','Intense']].map(([n,s,l])=>`<button class="option ${S.daily===n?'on':''}" data-daily="${n}"><span class="grow col"><span>${n} a day</span><span class="sub">${s}</span></span><span class="s14 b5" style="opacity:.7">${l}</span></button>`).join('')}
   <div class="option" style="cursor:default"><span class="grow col"><span class="sub">When</span><span>Afternoon · 16:30</span></span><span class="btn muted sm">Change</span></div></div>`, 'ob-notif');

screens['ob-notif'] = () => `
<div class="screen" style="align-items:center">${status()}${obTop(.83,'ob-daily')}
  <div class="col gap12" style="width:600px;margin-top:48px">
    <div class="s14 b6 sec">Step 5 of 6</div>
    <div class="serif t36">Let the questions come to you</div>
    <div class="s17 sec" style="line-height:1.4">One question a day on your lock screen — answer it right there, no need to open the app.</div>
    <div style="height:14px"></div>
    <div class="card col gap12" style="padding:18px 20px">
      <div class="row gap10"><span style="width:26px;height:26px;border-radius:8px;background:var(--ink);color:#fff;display:flex;align-items:center;justify-content:center" class="serif">T</span><span class="s12 b6 sec grow">TAKENOTES</span><span class="s12 sec">16:30</span></div>
      <div class="s14 b7">Statistics · from Lecture 2</div><div class="s17 b5">median — ?</div>
      <div class="row gap8">${['the middle value','the average','the most common'].map(a=>`<span class="grow" style="background:var(--canvas);border-radius:12px;padding:11px;text-align:center;font-size:14px;font-weight:600">${a}</span>`).join('')}</div>
    </div>
    <div class="s14 sec">You can hide the question text on the lock screen in Settings.</div>
  </div>
  <div class="grow"></div>
  <button class="btn ink" style="width:600px" data-go="ob-marks">Allow notifications</button>
  <button class="s16 b6 sec" style="margin:12px 0 32px" data-go="ob-marks">Not now</button>
</div>`;

screens['ob-marks'] = () => `
<div class="screen" style="align-items:center">${status()}${obTop(1,'ob-notif')}
  <div class="serif t36" style="margin-top:48px">We find the questions. You decide.</div>
  <div class="s17 sec" style="margin-top:10px">TakeNotes reads your notes and suggests questions — no AI, only what you wrote.</div>
  <div class="row gap16" style="padding:0 64px;margin-top:32px;width:100%">
    ${[['Underline to make sure','The whole line becomes a question',`<span class="hand" style="font-size:30px;border-bottom:2px solid #171614;box-shadow:0 5px 0 -3px #171614;padding-bottom:2px">slope of the tangent</span>`,'mine'],
       ['Circle the key part','It’s hidden — you fill the gap',`<span class="hand" style="font-size:32px;border:2px solid #171614;border-radius:50%;padding:2px 22px">f'(x) = 2x</span>`,'mine'],
       ['Write “term — definition”','We spot it and make a card',`<span class="hand" style="font-size:28px">median — the middle value</span>`,'sug']].map(([a,b,demo,k])=>`

  <div class="s17 sec" style="margin-top:8px">Works without AI. Your notes, your questions.</div>
  <div class="seg" style="margin-top:18px"><button class="${y?'on':''}" data-yearly="1">Yearly</button><button class="${!y?'on':''}" data-yearly="0">Monthly</button></div>
  <div class="row gap16" style="padding:22px 48px 0;width:100%;align-items:stretch;height:420px">
    ${plans.map(([k,n,p,per,tag,f])=>`<button class="grow col gap10 ${pick===k?'c-blue':''}" style="${pick===k?'':'background:var(--surface);'}border-radius:28px;padding:26px;text-align:left" data-plan="${k}">
      <div class="row" style="width:100%"><span class="s20 b7 grow">${n}</span>${pick===k?`<span class="check" style="background:var(--ink)">${I(ic.check,'#fff',14)}</span>`:''}</div>
      <div class="serif" style="font-size:40px">${p}</div><div class="s14 sec">${per||'&nbsp;'}</div><div style="height:4px"></div>
      ${f.map(x=>`<div class="row gap10" style="align-items:flex-start">${I(ic.check,'#171614',16)}<span class="s15 b5">${x}</span></div>`).join('')}
      <div class="grow"></div><div class="s13 b6 sec">${tag}</div></button>`).join('')}
  </div>
  <div class="grow"></div>
  <button class="btn ink" style="width:520px" data-toast="Thanks! (prototype — no real payment)">${pick==='free'?'Stay on Free':'Continue with '+(pick==='pro'?'Pro':'Basic')}</button>
  <div class="s13 sec" style="margin:10px 0 28px">Cancel any time in Settings. Prices depend on your country.</div>
  </div>`;
};

screens.settings = () => {
  const tg=(k)=>`<button class="toggle ${S.settings[k]?'on':''}" data-setting="${k}"><i></i></button>`;
  const group=(t,rows)=>`<div class="label">${t}</div><div class="card" style="border-radius:20px;padding:0 20px">${rows.map(([a,b,c],i)=>`<div class="row gap12" style="padding:15px 0;${i?'border-top:1px solid var(--muted)':''}"><div class="grow"><div class="s16 b6">${a}</div>${b?`<div class="s13 sec">${b}</div>`:''}</div>${c||''}</div>`).join('')}</div>`;
  return `<div class="screen">${status()}
  <div class="row gap20 grow" style="padding:12px 24px 24px;align-items:stretch;min-height:0">
    <div class="col gap4" style="width:280px"><div class="row gap8"><button data-go="home">${I(ic.back)}</button><span class="serif t34">Settings</span></div><div style="height:14px"></div>
      ${['Daily questions','Notebooks & paper','Language','Privacy','Plan','Account','Help'].map((t,i)=>`<button class="side-item ${i===0?'on':''}" ${t==='Plan'?'data-go="plans"':''}>${t}</button>`).join('')}</div>
    <div class="grow col gap10 scroll">
      ${group('Daily questions',[['Questions a day','About '+Math.round(S.settings.daily*0.6)+' minutes',`<div class="seg">${[3,5,10,15].map(v=>`<button class="${S.settings.daily===v?'on':''}" data-sdaily="${v}">${v}</button>`).join('')}</div>`],['Time','When classes usually end','<span class="s16 b6 sec">16:30</span>'],['Quiet on weekends','No questions on Sat and Sun',tg('weekend')]])}
      ${group('Quiz',[['Underline adds to the quiz','Turn off if you underline for emphasis — circles and “term — definition” still work',tg('underline')],['Suggested questions','Light Q on lines that look important',tg('suggest')]])}
      ${group('Privacy',[['Show question text on lock screen',S.settings.lock?'On — the question is visible':'Off — the notification says “1 question from Mathematics”',tg('lock')],['Preview the notification','',`<button class="btn muted sm" data-go="lock">Open</button>`]])}
      ${group('Language',[['App language','','<span class="s16 b6 sec">English</span>'],['Handwriting language','Set per notebook — this is the default','<span class="s16 b6 sec">Auto · English, Russian</span>']])}
      ${group('Account',[['Signed in with Apple','alex@icloud.com',''],['Delete account','Deletes your notebooks from our servers','<button class="s16 b6 sec" data-toast="Asks to confirm twice (prototype)">Delete</button>']])}
    </div>
  </div></div>`;
};

/* ---------- overlays ---------- */
const overlays = {};
overlays.quizchoice = () => `<div class="dim"><div class="sheet col gap12">
  <div class="row"><div class="grow"><div class="serif t28">Quiz on…</div><div class="s15 sec">Mathematics</div></div><button data-close>${I(ic.close,'#6F6B64')}</button></div><div style="height:6px"></div>
  ${[['Today’s lesson','Lecture 7 · Mon 26 Oct',1],['A day','Pick a date',0],['From – to','e.g. since the midterm',0],['A topic','A heading or a selection',0],['Whole notebook','38 pages',0]].map(([a,b,s],i)=>`<button class="row gap12 ${S.qc===i||(S.qc===undefined&&s)?'c-blue':''}" style="${S.qc===i||(S.qc===undefined&&s)?'':'background:var(--canvas);'}border-radius:18px;padding:15px 18px;text-align:left" data-qc="${i}"><span class="grow"><div class="s17 b6">${a}</div><div class="s14 sec">${b}</div></span><span class="check" style="width:24px;height:24px;background:${S.qc===i||(S.qc===undefined&&s)?'var(--ink)':'var(--surface)'}">${S.qc===i||(S.qc===undefined&&s)?I(ic.check,'#fff',14):''}</span></button>`).join('')}
  <div class="row" style="margin-top:6px"><span class="s16 b6 grow">Questions</span><div class="seg"><button class="on">5</button><button>10</button><button>15</button></div></div>
  <button class="btn ink" style="margin-top:8px" data-start-quiz>Start · about 3 min</button></div></div>`;
overlays.report = () => `<div class="dim" style="align-items:flex-end"><div class="bottom-sheet col gap14" style="position:relative;width:100%">
  <div class="serif t28">What’s wrong with this question?</div><div class="s15 sec">Your fix stays — the question won’t come back the same way.</div>
  ${['My handwriting was read wrong','The right answer is different','This isn’t worth a question','Delete this question'].map((a,i)=>`<button class="col gap10 ${S.rep===i?'c-blue':''}" style="${S.rep===i?'':'background:var(--canvas);'}border-radius:18px;padding:15px 18px;text-align:left" data-rep="${i}"><span class="s17 b6">${a}</span>${S.rep===i&&i===0?`<span class="s13 b6 sec">What it should say:</span><span class="row" style="background:var(--surface);border-radius:12px;padding:10px 14px"><span class="hand grow" style="font-size:24px">f(x) = x²  →  f'(x) = 2x</span><span class="s12 b5 sec">Recognised: “f(x) = x2 → f(x) = 2x”</span></span>`:''}</button>`).join('')}
  <div class="row gap12"><button class="btn muted grow" data-close>Cancel</button><button class="btn ink grow" data-rep-save>Save fix</button></div></div></div>`;
overlays.newnb = () => `<div class="dim"><div class="sheet col gap16" style="width:600px">
  <div class="row"><span class="serif t28 grow">New notebook</span><button data-close>${I(ic.close,'#6F6B64')}</button></div>
  <div class="col gap8"><span class="label">Name</span><input class="field" value="${S.newNb.name}" data-nbname></div>
  <div class="col gap8"><span class="label">Colour</span><div class="row gap12">${['blue','orange','green','purple','yellow'].map(c=>`<button style="padding:4px;border-radius:50%;${S.newNb.color===c?'outline:2px solid #171614':''}" data-nbcolor="${c}"><span class="c-${c}" style="display:block;width:32px;height:32px;border-radius:50%"></span></button>`).join('')}</div></div>
  <div class="col gap8"><span class="label">Paper</span><div class="seg" style="align-self:flex-start">${['Lines','Grid','Dots','Blank'].map(p=>`<button class="${S.newNb.paper===p?'on':''}" data-nbpaper="${p}">${p}</button>`).join('')}</div><span class="s13 sec">${S.newNb.paper==='Grid'?'Grid suggested for '+S.newNb.name+' — you can switch any time in the toolbar.':'You can switch any time in the toolbar.'}</span></div>
  <div class="col gap8"><span class="label">Classes from your week</span><div class="row" style="background:var(--canvas);border-radius:14px;padding:14px"><span class="grow"><div class="s16 b6">Wed 10:00 and Fri 12:00</div><div class="s13 sec">Opens on today’s page during these classes</div></span><button class="btn surface sm" data-overlay="addclass">Change</button></div></div>
  <div class="col gap8"><span class="label">Exam</span><div class="row gap10" style="background:var(--canvas);border-radius:14px;padding:14px">${I(ic.plus,'#6F6B64',18)}<span class="s16 b5 sec">Add exam date (optional)</span></div></div>
  <button class="btn ink" data-create-nb>Create notebook</button></div></div>`;
overlays.addclass = () => `<div class="dim"><div class="sheet col gap16">
  <div class="row"><span class="serif t28 grow">Add class</span><button data-close>${I(ic.close,'#6F6B64')}</button></div>
  <div class="col gap8"><span class="label">Notebook</span><div class="row gap10" style="background:var(--canvas);border-radius:14px;padding:14px 16px"><span class="dot c-yellow"></span><span class="grow s17 b5">Statistics</span>${I(ic.down,'#6F6B64',18)}</div></div>
  <div class="col gap8"><span class="label">Day</span><div class="row gap8">${['Mon','Tue','Wed','Thu','Fri'].map((d,i)=>`<button class="pill" style="padding:9px 14px;font-size:14px;background:${S.addClass.day===i?'var(--ink)':'var(--canvas)'};color:${S.addClass.day===i?'#fff':'inherit'}" data-acday="${i}">${d}</button>`).join('')}</div></div>
  <div class="col gap8"><span class="label">Time</span><div class="row gap10"><div class="grow" style="background:var(--canvas);border-radius:14px;padding:12px 16px"><div class="s12 b6 sec">Starts</div><div class="s18 b6">15:00</div></div><div class="grow" style="background:var(--canvas);border-radius:14px;padding:12px 16px"><div class="s12 b6 sec">Ends</div><div class="s18 b6">16:30</div></div></div></div>
  <div class="col gap8"><span class="label">Repeats</span><div class="seg" style="align-self:flex-start"><button class="on">Every week</button><button>Every 2 weeks</button></div><span class="s13 sec">Until the end of the term · skip single dates later</span></div>
  <button class="btn ink" data-add-class>Add to my week</button></div></div>`;
overlays.guest = () => `<div class="dim"><div class="sheet col gap14" style="width:520px">
  <div class="row gap8">${['blue','orange','green','purple','yellow'].map(c=>`<span class="c-${c}" style="width:56px;height:72px;border-radius:10px"></span>`).join('')}<span style="width:56px;height:72px;border-radius:10px;background:var(--muted);display:flex;align-items:center;justify-content:center">${I(ic.plus,'#6F6B64',18)}</span></div>
  <div class="serif t30">That’s 5 notebooks</div>
  <div class="s16 sec" style="line-height:1.45">Guests can keep up to 5. Sign in to add more — it’s free, and your notebooks stay safe if you lose your iPad.</div>
  <button class="btn ink" data-go="signin">Sign in to continue</button><button class="s15 b6 sec" data-close>Not now</button></div></div>`;

/* ---------- menu ---------- */
const menuGroups = [
  ['Onboarding',[['Welcome','welcome'],['Name','ob-name'],['What you study','ob-study'],['What gets in the way','ob-obstacles'],['Daily questions','ob-daily'],['Notifications','ob-notif'],['How questions are made','ob-marks'],['Sign in','signin']]],
  ['Set up',[['Your week','week'],['Add class','week:addclass'],['New notebook','home:newnb'],['Home · empty','home-empty'],['Guest limit','home:guest']]],
  ['Everyday',[['Home','home'],['Notebook','notebook'],['Notebook · empty','nb-empty'],['Exam plan','examplan'],['Search','search']]],
  ['Notes',[['Editor','editor'],['Editor · Materials','editor-mat'],['Materials · Collect','editor-col'],['Insert menu','editor-ins'],['Lecture recording · Pro','editor-rec'],['Test myself','testmyself']]],
  ['Quiz & review',[['Quiz · what to test','notebook:quizchoice'],['Quiz (5 question types)','quiz-lesson'],['Due today session','quiz-due'],['Lock-screen question','lock']]],
  ['Plans & settings',[['Plans','plans'],['Settings','settings']]]
];
function jump(k){
  const [scr,ov]=k.split(':'); S.overlay=null; S.panel=null; S.emptyHome=false;
  if(k==='home-empty'){S.emptyHome=true;return go('home');}
  if(k==='nb-empty'){S.currentNb='Statistics';return go('notebook');}
  if(k==='notebook'||scr==='notebook'){S.currentNb='Mathematics';}
  if(k==='editor-mat'){S.panel='materials';return go('editor');}
  if(k==='editor-col'){S.panel='collect';return go('editor');}
  if(k==='editor-ins'){go('editor');S.overlay='insert';return render();}
  if(k==='editor-rec'){S.recording=true;return go('editor');}
  if(k==='testmyself'){S.tm={revealed:{},recalled:0,seenIntro:false,asking:null};}
  if(k==='quiz-lesson')return startQuiz('lesson');
  if(k==='quiz-due')return startQuiz('due');
  if(k==='lock'){S.notif=null;}
  go(scr); if(ov){S.overlay=ov;render();}
}
document.getElementById('menu').innerHTML = menuGroups.map(([g,items])=>`<h4>${g}</h4>`+items.map(([t,k])=>`<button data-jump="${k}">${t}</button>`).join('')).join('');
document.getElementById('menuBtn').onclick=()=>document.getElementById('menu').classList.toggle('open');
document.getElementById('restart').onclick=()=>{S=initial();render();};

/* ---------- render ---------- */
const device=document.getElementById('device');
let lastKey='';
function render(){
  const fn = screens[S.screen] || screens.home;
  const key = S.screen+'|'+S.overlay+'|'+(S.quiz?S.quiz.i+S.quiz.state:'')+'|'+(S.tm&&S.tm.seenIntro);
  device.classList.toggle('noanim', key===lastKey); lastKey=key;
  device.innerHTML = fn() + (S.overlay && overlays[S.overlay] ? overlays[S.overlay]() : '') + (S.toast?`<div class="toast">${S.toast}</div>`:'');
}
function fit(){const s=Math.min((innerWidth-32)/1194,(innerHeight-56-24)/834,1);device.style.transform=`scale(${s})`;}
addEventListener('resize',fit);fit();

/* ---------- events ---------- */
device.addEventListener('input',e=>{
  const t=e.target;
  if(t.dataset.input){S[t.dataset.input]=t.value;}
  if(t.hasAttribute('data-answer')){S.quiz.answer=t.value;const b=device.querySelector('[data-check]');if(b)b.disabled=!t.value;}
  if(t.hasAttribute('data-nbname')){S.newNb.name=t.value;}
});
device.addEventListener('click',e=>{
  const el=e.target.closest('button,[data-q]'); if(!el) return; const d=el.dataset;
  if(d.go){ if(d.panel)S.panel=d.panel; return go(d.go); }
  if(d.overlay!==undefined){ if(d.overlay==='insert')return; S.overlay=d.overlay; S.rep=undefined; return render(); }
  if(d.close!==undefined){ S.overlay=null; return render(); }
  if(d.toast){ return toast(d.toast); }
  if(d.setYear){ S.year=d.setYear; return render(); }
  if(d.toggleOb){ S.obstacles[d.toggleOb]=!S.obstacles[d.toggleOb]; return render(); }
  if(d.daily){ S.daily=+d.daily; S.settings.daily=+d.daily; return render(); }
  if(d.signin!==undefined){ S.guest=false; toast('Signed in'); return go('week'); }
  if(d.guest!==undefined){ S.guest=true; return go('week'); }
  if(d.openNb){ S.currentNb=d.openNb; return go('notebook'); }
  if(d.newNb!==undefined){ S.overlay=(S.guest&&S.notebooks.length>=5)?'guest':'newnb'; return render(); }
  if(d.nbcolor){ S.newNb.color=d.nbcolor; return render(); }
  if(d.nbpaper){ S.newNb.paper=d.nbpaper; return render(); }
  if(d.createNb!==undefined){ if(!S.notebooks.find(n=>n.name===S.newNb.name)) S.notebooks.push({id:'n'+Date.now(),name:S.newNb.name,color:S.newNb.color,meta:'No pages yet',pages:0}); S.overlay=null; S.emptyHome=false; toast(S.newNb.name+' created'); return; }
  if(d.acday){ S.addClass.day=+d.acday; return render(); }
  if(d.addClass!==undefined){ S.classes.push([S.addClass.day,'Statistics',15,16.5,'Room 108']); S.overlay=null; if(S.screen!=='week')S.screen='week'; toast('Added — repeats every week'); return; }
  if(d.startDue!==undefined) return startQuiz('due');
  if(d.startQuiz!==undefined) return startQuiz(S.screen==='results'?S.quiz.set:'lesson');
  if(d.qc){ S.qc=+d.qc; return render(); }
  // editor
  if(d.paper){ S.paper=d.paper; return render(); }
  if(d.tool){ if(d.tool==='insert'){ S.overlay=S.overlay==='insert'?null:'insert'; } else { S.tool=d.tool; S.overlay=null; } return render(); }
  if(d.insert){ S.overlay=null; if(d.insert==='Cut-out from materials'||d.insert==='PDF or slides'){S.panel='materials';} else toast(d.insert+' (prototype)'); return render(); }
  if(d.togglePanel!==undefined){ S.panel=S.panel?null:'materials'; return render(); }
  if(d.panelSet){ S.panel=d.panelSet; return render(); }
  if(d.collect){ S.collect[d.collect]=!S.collect[d.collect]; return render(); }
  if(d.collectAdd!==undefined){ S.collected=true; S.panel='materials'; toast('Added to the page with Q'); return; }
  if(d.rec!==undefined){ S.recording=!S.recording; return render(); }
  if(d.q){ const order={sug:'mine',mine:'off',off:'sug'}; S.qmarks[d.q]=order[S.qmarks[d.q]]; return toast({mine:'In your quiz',off:'Taken out of the quiz',sug:'Back as a suggestion'}[S.qmarks[d.q]]); }
  // test myself
  if(d.tmIntro!==undefined){ S.tm.seenIntro=true; return render(); }
  if(d.reveal){ S.tm.asking=d.reveal; S.tm.revealed[d.reveal]='pending'; return render(); }
  if(d.tm){ S.tm.revealed[S.tm.asking]=d.tm; if(d.tm==='knew')S.tm.recalled++; S.tm.asking=null; return render(); }
  // quiz
  if(d.pick!==undefined && S.quiz){ S.quiz.pick=+d.pick; return render(); }
  if(d.check!==undefined){ const Q=S.quiz,q=quizSets[Q.set][Q.i]; let ok; if(q.type==='term')ok=Q.pick===q.correct; else ok=norm(Q.answer)===norm(q.answer); Q.state=ok?'right':'wrong'; Q.results.push(ok?1:0); return render(); }
  if(d.show!==undefined){ const Q=S.quiz; Q.state='wrong'; Q.answer=Q.answer||'—'; Q.results.push(0); return render(); }
  if(d.revealAns!==undefined){ S.quiz.revealed=true; return render(); }
  if(d.self!==undefined){ const Q=S.quiz; Q.results.push(+d.self); Q.state='self'; return render(); }
  if(d.nextq!==undefined){ const Q=S.quiz; if(Q.i+1<quizSets[Q.set].length){ Object.assign(Q,{i:Q.i+1,answer:'',pick:null,state:'ask',revealed:false}); return render(); } return go('results'); }
  if(d.rep!==undefined){ S.rep=+d.rep; return render(); }
  if(d.repSave!==undefined){ S.overlay=null; return toast('Saved — the question is fixed'); }
  // notification
  if(d.notif!==undefined){ S.notif=+d.notif; return render(); }
  if(d.notifReset!==undefined){ S.notif=null; return render(); }
  // plans & settings
  if(d.yearly!==undefined){ S.plans.yearly=d.yearly==='1'; return render(); }
  if(d.plan){ S.plans.pick=d.plan; return render(); }
  if(d.setting){ S.settings[d.setting]=!S.settings[d.setting]; return render(); }
  if(d.sdaily){ S.settings.daily=+d.sdaily; return render(); }
});
document.getElementById('menu').addEventListener('click',e=>{const b=e.target.closest('[data-jump]');if(!b)return;document.getElementById('menu').classList.remove('open');jump(b.dataset.jump);});
S.settings.underline=true; S.settings.suggest=true;
render();
</script>
</body>
</html>
